<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#041b5d">
    <title>CaprinuSIG</title>

    <!-- Fonte: sistema (mesma pilha do InOviSertão), sem Google Fonts -->

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.src.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@5.3.3/dist/Control.FullScreen.css" />
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <button class="botao-toggle-painel" onclick="togglePainel()" title="Mostrar/Ocultar painel" aria-label="Mostrar ou ocultar painel">
        <i data-lucide="panel-right"></i>
    </button>

    <div id="map"></div>

    <div id="painel-lateral">
        <!-- TOPO -->
        <div class="topo-painel">
            <!-- BOTÃO FECHAR INTERNO -->
            <button class="btn-fechar-painel" onclick="togglePainel()" title="Fechar painel" aria-label="Fechar painel">
                <i data-lucide="x"></i>
            </button>

            <div class="logo-area">
                <div class="logo-icon"><i data-lucide="map-pinned"></i></div>
                <div class="logo-text-group">
                    <p class="logo-title">CaprinuSIG</p>
                </div>
            </div>

            <label class="filtro-label" for="filtro-dados">Métrica espacial</label>
            <div class="select-wrapper">
                <select id="filtro-dados">
                    <option value="qtd_ovinos">Quantidade de Ovinos</option>
                    <option value="qtd_caprinos">Quantidade de Caprinos</option>
                    <option value="total_produtores">Total de Produtores</option>
                </select>
                <i data-lucide="chevron-down"></i>
            </div>

            <!-- VISUALIZAÇÃO: círculos ou mapa de calor -->
            <span class="filtro-label vis-rotulo" id="rotulo-visualizacao">Visualização</span>
            <div class="visualizacao" role="group" aria-labelledby="rotulo-visualizacao">
                <button type="button" class="vis-btn ativo" data-modo="circulos" aria-pressed="true">
                    <i data-lucide="circle-dot"></i> Círculos
                </button>
                <button type="button" class="vis-btn" data-modo="calor" aria-pressed="false">
                    <i data-lucide="flame"></i> Calor
                </button>
            </div>

            <!-- FILTROS E EXPORTAÇÃO -->
            <details class="filtros" id="filtros">
                <summary>
                    <span class="filtros-titulo">
                        <i data-lucide="sliders-horizontal"></i> Filtros
                        <span class="filtros-badge" id="filtros-badge" hidden>0</span>
                    </span>
                    <i data-lucide="chevron-down" class="filtros-chevron"></i>
                </summary>

                <div class="filtros-corpo">
                    <div class="filtros-grade">
                        <!-- Só aparece se a API enviar a propriedade "municipio" -->
                        <div class="filtro-campo" id="campo-municipio" hidden>
                            <label class="filtro-label-peq" for="filtro-municipio">Município</label>
                            <div class="select-wrapper">
                                <select id="filtro-municipio"><option value="">Todos</option></select>
                                <i data-lucide="chevron-down"></i>
                            </div>
                        </div>

                        <div class="filtro-campo">
                            <label class="filtro-label-peq" for="filtro-sistema">Sistema de criação</label>
                            <div class="select-wrapper">
                                <select id="filtro-sistema">
                                    <option value="">Todos</option>
                                    <option value="extensiva">Extensiva</option>
                                    <option value="semi_extensiva">Semi-extensiva</option>
                                    <option value="intensiva">Intensiva</option>
                                </select>
                                <i data-lucide="chevron-down"></i>
                            </div>
                        </div>

                        <div class="filtro-campo">
                            <label class="filtro-label-peq" for="filtro-escrituracao">Escrituração</label>
                            <div class="select-wrapper">
                                <select id="filtro-escrituracao">
                                    <option value="">Todas</option>
                                    <option value="sem">Sem escrituração</option>
                                    <option value="com">Com escrituração</option>
                                </select>
                                <i data-lucide="chevron-down"></i>
                            </div>
                        </div>
                    </div>

                    <p class="filtros-nota">
                        Sistema: o predominante na comunidade. Sem escrituração: nenhum produtor registra.
                    </p>

                    <div class="filtros-rodape">
                        <span id="filtros-resultado" aria-live="polite"></span>
                        <button type="button" class="btn-link" id="btn-limpar-filtros" hidden>Limpar filtros</button>
                    </div>

                    <button type="button" class="btn-exportar" id="btn-exportar-csv" disabled>
                        <i data-lucide="download"></i> <span>Baixar CSV</span>
                    </button>
                </div>
            </details>
        </div>

        <!-- CORPO COM SCROLL -->
        <div id="scroll-painel">
            <div id="conteudo-dinamico" class="conteudo-painel">
                <div class="placeholder-wrap">
                    <div class="placeholder-icon"><i data-lucide="map"></i></div>
                    <p class="placeholder-texto">Carregando dados<br>geoespaciais da API…</p>
                </div>
            </div>
        </div>

        <!-- RODAPÉ -->
        <div class="painel-footer">
            <span class="painel-footer-texto" id="status-texto">Conectando à API…</span>
            <div class="painel-footer-dot" id="status-dot" title="Status da API"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://unpkg.com/leaflet-easyprint@2.1.9/dist/bundle.js"></script>
    <script src="https://unpkg.com/leaflet-search@3.0.9/dist/leaflet-search.src.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet.fullscreen@5.3.3/dist/Control.FullScreen.umd.js"></script>
    <script src="https://unpkg.com/leaflet-hash@0.2.1/leaflet-hash.js"></script>
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
