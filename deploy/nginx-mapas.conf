# ── SIGWeb Caprinu em inovisertao.com.br/mapas ────────────────────────────────
# Cole estes blocos DENTRO do server { } já existente do inovisertao.com.br
# (normalmente em /etc/nginx/sites-available/inovisertao.com.br).
# Depois: sudo nginx -t && sudo systemctl reload nginx

# API: repassa /mapas/api/... para o Uvicorn em /api/...
# (porta 8001 porque a 8000 do host e usada pelo container caprinu_api-web-1)
location /mapas/api/ {
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Garante a barra final para os assets relativos (style.css, app.js) resolverem
location = /mapas {
    return 301 /mapas/;
}

# Frontend estático
location /mapas/ {
    alias /var/www/sigweb-caprinu/frontend/;
    index index.html;
}
